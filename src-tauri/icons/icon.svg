<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#138494"/>
      <stop offset="1" stop-color="#08505A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6F0F0"/>
    </linearGradient>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D2B2D"/>
      <stop offset="1" stop-color="#0E1718"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#021C20" flood-opacity=".45"/>
    </filter>
  </defs>
  <!-- Grundfläche im macOS-Raster (824 auf 1024) -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#sheen)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="183.5" fill="none" stroke="#fff" stroke-opacity=".12"/>
  <!-- hinteres Blatt -->
  <g filter="url(#drop)">
    <path d="M330 236h250l118 118v330H330z" fill="#BFE3E6" transform="rotate(-7 512 512)"/>
    <!-- vorderes Blatt mit Eselsohr -->
    <path d="M354 224h262l120 120v368a20 20 0 0 1-20 20H354a20 20 0 0 1-20-20V244a20 20 0 0 1 20-20z" fill="url(#paper)"/>
    <path d="M616 224v100a20 20 0 0 0 20 20h100z" fill="#B7D6D9"/>
    <!-- Zeilen -->
    <rect x="398" y="330" width="170" height="22" rx="11" fill="#0B6E7B"/>
    <rect x="398" y="390" width="270" height="18" rx="9" fill="#9DB9BC"/>
    <rect x="398" y="436" width="236" height="18" rx="9" fill="#9DB9BC"/>
    <rect x="398" y="482" width="270" height="18" rx="9" fill="#9DB9BC"/>
    <!-- Werkbank: Schraubstock hält das Blatt -->
    <rect x="252" y="586" width="520" height="112" rx="26" fill="url(#bench)"/>
    <rect x="252" y="586" width="520" height="22" rx="11" fill="#3FB3C2"/>
    <rect x="300" y="644" width="40" height="14" rx="7" fill="#fff" fill-opacity=".14"/>
    <rect x="356" y="644" width="40" height="14" rx="7" fill="#fff" fill-opacity=".14"/>
    <rect x="412" y="644" width="40" height="14" rx="7" fill="#fff" fill-opacity=".14"/>
  </g>
</svg>
